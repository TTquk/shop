<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <!--
    商品封面建议用「正方形」构图。
    列表缩略图（约 250×132）和详情页封面（210×210）都用 background-size: cover，
    非正方形的图会被裁切；把主体放在正中，两种比例下都能完整显示。
  -->
  <defs>
    <linearGradient id="gmc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" fill="url(#gmc)"/>

  <!-- 装饰：放在四角，裁切时不会伤到主体 -->
  <circle cx="540" cy="120" r="190" fill="#ffffff" opacity=".10"/>
  <circle cx="110" cy="550" r="160" fill="#000000" opacity=".12"/>
  <g fill="#ffffff" opacity=".09">
    <rect x="470" y="450" width="40" height="40"/>
    <rect x="510" y="450" width="40" height="40"/>
    <rect x="470" y="490" width="40" height="40"/>
    <rect x="550" y="490" width="40" height="40"/>
    <rect x="430" y="530" width="40" height="40"/>
  </g>

  <!-- 主体：居中 -->
  <text x="320" y="368" text-anchor="middle"
        font-family="Segoe UI,Helvetica,Arial,sans-serif"
        font-size="152" font-weight="700" fill="#ffffff" opacity=".95">MC</text>
</svg>
