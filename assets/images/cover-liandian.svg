<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
  <!--
    商品封面：正方形构图，主体居中。
    列表缩略图（约 250×132）和详情页封面（210×210）都用 background-size: cover，
    横向图会被裁掉上下两条，所以商品封面必须用正方形并把文字放正中。
    （横向的 cover-1…8 是分类图标专用，不要拿来当商品封面）
  -->
  <defs>
    <linearGradient id="gliandian" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="640" height="640" fill="url(#gliandian)"/>

  <!-- 装饰：放在四角，裁切时不会伤到主体 -->
  <circle cx="540" cy="120" r="190" fill="#ffffff" opacity=".10"/>
  <circle cx="110" cy="550" r="160" fill="#000000" opacity=".12"/>

  <!-- 主体：居中（中文需要 CJK 字体回退） -->
  <text x="320" y="372" text-anchor="middle"
        font-family="Segoe UI,Microsoft YaHei,PingFang SC,Helvetica,Arial,sans-serif"
        font-size="152" font-weight="700" fill="#ffffff" opacity=".95">连点</text>
</svg>
